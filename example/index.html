<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soulbound Auth - Example</title>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        .status {
            background: #f0f0f0;
            padding: 10px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .hidden {
            display: none;
        }
        .account-id {
            word-break: break-all;
            background: #e0e0e0;
            padding: 5px;
            border-radius: 3px;
            font-size: 12px;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Soulbound Auth Example</h1>
    
    <div class="status">
        <div>Status: <span id="status">Disconnected</span></div>
        <div>Has SBT: <span id="hasSBT">false</span></div>
        <div>Account ID: <span id="accountId" class="account-id">none</span></div>
    </div>
    
    <div id="connect-section">
        <button onclick="connect()">Connect Wallet</button>
    </div>
    
    <div id="mint-section" class="hidden">
        <h3>Terms of Service</h3>
        <p>By minting an SBT, you agree that your address will never be stored server-side.</p>
        <label>
            <input type="checkbox" id="accept-terms" onchange="toggleMint()">
            I accept the terms
        </label>
        <br><br>
        <button id="mint-btn" disabled onclick="mintSBT()">Mint SBT</button>
    </div>
    
    <div id="auth-section" class="hidden">
        <button onclick="authenticate()">Refresh Auth</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>
    
    <h3>Log</h3>
    <pre id="log"></pre>
    
    <script>
        // Minimal SBT Contract ABI
        const SBT_ABI = [
            "function mintSBT(bytes32 eulaHash, uint8 version) returns (uint256, bytes32)",
            "function getAccountInfo(address owner) view returns (bool, bytes32, uint256)"
        ];
        
        let provider, signer, address, sbtContract;
        const SBT_ADDRESS = '0x0000000000000000000000000000000000000000'; // Replace with deployed address
        const SERVER_URL = 'http://localhost:3000'; // Replace with your server
        
        function log(message) {
            const logEl = document.getElementById('log');
            logEl.textContent = new Date().toISOString() + ' - ' + message + '\n' + logEl.textContent;
        }
        
        async function connect() {
            try {
                if (!window.ethereum) throw new Error('No wallet found');
                
                // Connect wallet
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                address = await signer.getAddress();
                
                log('Connected: ' + address);
                
                // Setup contract
                sbtContract = new ethers.Contract(SBT_ADDRESS, SBT_ABI, signer);
                
                // Check SBT status
                const [hasSBT, accountId] = await sbtContract.getAccountInfo(address);
                
                // Authenticate with server
                await authenticate();
                
                updateUI(hasSBT, accountId);
                
            } catch (error) {
                log('Error: ' + error.message);
            }
        }
        
        async function authenticate() {
            try {
                // Generate message to sign
                const message = `Authenticate to SBA\nTimestamp: ${Date.now()}`;
                const signature = await signer.signMessage(message);
                
                // Send to server (example)
                const response = await fetch(`${SERVER_URL}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address, signature, message })
                });
                
                const data = await response.json();
                log('Authenticated. JWT received, hasSBT: ' + data.hasSBT);
                
                // Store JWT (in production, handle this properly)
                localStorage.setItem('sba_jwt', data.token);
                
            } catch (error) {
                log('Auth error: ' + error.message);
                // For demo, continue without server
                log('Demo mode - continuing without server');
            }
        }
        
        async function mintSBT() {
            try {
                // Generate EULA hash
                const eulaText = "Terms of Service v1.0";
                const eulaHash = ethers.utils.keccak256(ethers.utils.toUtf8Bytes(eulaText));
                
                log('Minting SBT...');
                
                // Call contract
                const tx = await sbtContract.mintSBT(eulaHash, 1);
                log('Transaction sent: ' + tx.hash);
                
                const receipt = await tx.wait();
                log('SBT minted in block ' + receipt.blockNumber);
                
                // Get the new account ID
                const [hasSBT, accountId] = await sbtContract.getAccountInfo(address);
                
                // Confirm with server
                await confirmMint(tx.hash, eulaHash);
                
                updateUI(hasSBT, accountId);
                
            } catch (error) {
                log('Mint error: ' + error.message);
                // For demo without deployed contract
                const mockAccountId = ethers.utils.keccak256(ethers.utils.toUtf8Bytes(address + Date.now()));
                log('Demo mode - mock account ID: ' + mockAccountId);
                updateUI(true, mockAccountId);
            }
        }
        
        async function confirmMint(txHash, eulaHash) {
            try {
                const message = `Confirm SBT mint: ${txHash}`;
                const signature = await signer.signMessage(message);
                
                const response = await fetch(`${SERVER_URL}/confirm-mint`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('sba_jwt')}`
                    },
                    body: JSON.stringify({ 
                        address, 
                        signature, 
                        eulaHash, 
                        version: 1, 
                        txHash 
                    })
                });
                
                const data = await response.json();
                log('Mint confirmed. New JWT with account ID received');
                localStorage.setItem('sba_jwt', data.token);
                
            } catch (error) {
                log('Confirm error: ' + error.message);
            }
        }
        
        function updateUI(hasSBT, accountId) {
            document.getElementById('status').textContent = address ? 'Connected' : 'Disconnected';
            document.getElementById('hasSBT').textContent = hasSBT ? 'true' : 'false';
            document.getElementById('accountId').textContent = accountId || 'none';
            
            document.getElementById('connect-section').classList.toggle('hidden', !!address);
            document.getElementById('mint-section').classList.toggle('hidden', !address || hasSBT);
            document.getElementById('auth-section').classList.toggle('hidden', !hasSBT);
        }
        
        function toggleMint() {
            document.getElementById('mint-btn').disabled = !document.getElementById('accept-terms').checked;
        }
        
        function disconnect() {
            provider = null;
            signer = null;
            address = null;
            localStorage.removeItem('sba_jwt');
            updateUI(false, null);
            log('Disconnected');
        }
        
        // Load ethers from CDN
        const script = document.createElement('script');
        script.src = 'https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js';
        document.head.appendChild(script);
    </script>
</body>
</html>
